<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Viewer Page</title>

<script src="https://cdn.babylonjs.com/viewer/babylon.viewer.js"></script>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial;
}

.container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    padding: 20px;
}

.viewer-box {
    flex: 1 1 500px;
    min-height: 500px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
}

iframe {
    width: 100%;
    height: 500px;
    border: none;
}

babylon {
    width: 100%;
    height: 500px;
}
</style>
</head>

<body>

<h1 style="text-align:center;">My 3D Showcase</h1>

<div class="container">

    <div class="viewer-box">
        <iframe 
        title="Sketchfab Model"
        src="https://sketchfab.com/3d-models/fumofumo-b41df1817bec4311a0a1d3b5c3252f16/embed"
        allowfullscreen>
        </iframe>
    </div>

    <div class="viewer-box">
        <babylon model="model.glb"></babylon>
    </div>

</div>

</body>
</html>
